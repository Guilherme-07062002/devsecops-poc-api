name: DevSecOps Security Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Secret Scanning
  # -------------------------------------------------------------
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # STAGE 2: SAST (Static Application Security Testing)
  # -------------------------------------------------------------
  sast-scan:
    name: Code Security Scan (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config=auto --sarif -o /src/semgrep.sarif

      - name: Upload SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always() && hashFiles('semgrep.sarif') != ''

      - name: Enforce Semgrep policy
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config=auto --error /src

  # -------------------------------------------------------------
  # STAGE 3: SCA & Container Scanning
  # -------------------------------------------------------------
  dependency-and-container-scan:
    name: SCA & Container Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        # 1. Instala o pnpm primeiro
      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run application tests
        run: pnpm test

      - name: Run Trivy FS Scan (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: false
          format: "sarif"
          output: "trivy-sca-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload SCA SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-sca-results.sarif"
          category: "trivy-sca"
        if: always() && hashFiles('trivy-sca-results.sarif') != ''

      - name: Enforce filesystem scan policy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: false
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Build container image
        run: docker build --tag devsecops-poc-api:${{ github.sha }} .

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-poc-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

  # -------------------------------------------------------------
  # STAGE 4: IaC Scan (Terraform)
  # -------------------------------------------------------------
  iac-scan:
    name: IaC Security Scan (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true

      - name: Upload Checkov SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: "checkov-iac"
        if: always() && hashFiles('checkov.sarif') != ''

      - name: Enforce Checkov policy
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: false
